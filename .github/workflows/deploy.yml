---
name: Build and Deploy
"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout learn
        uses: actions/checkout@v4

      # flake.lock is the single source of truth for the mdBook version, so the
      # deployed site matches local `mdbook serve` exactly. Everything in the
      # dev shell comes prebuilt from cache.nixos.org — nothing compiles here.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Built natively on x86. The output is plain HTML, so it never needs to
      # pass through the arm64 emulation below.
      - name: Build the book
        run: nix develop -c mdbook build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            lorenzolfm/learn:${{ github.sha }}
            lorenzolfm/learn:arm
            lorenzolfm/learn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout homelab repo
        uses: actions/checkout@v4
        with:
          repository: lorenzolfm/homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab

      # Path is apps/<app>/app.yaml since homelab commit 45bec0a renamed
      # <app>.yaml -> app.yaml. Renovate re-pins the @sha256 digest afterwards.
      - name: Update image tag in homelab
        run: |
          cd homelab
          manifest=apps/learn/app.yaml
          grep -q "image: docker.io/lorenzolfm/learn:" "$manifest" \
            || { echo "::error::no learn image line in $manifest - path or pattern is stale"; exit 1; }
          sed -i "s|image: docker.io/lorenzolfm/learn:.*|image: docker.io/lorenzolfm/learn:${{ github.sha }}|" "$manifest"

      - name: Commit and push to homelab
        run: |
          cd homelab
          git diff --quiet && { echo "image tag already up to date"; exit 0; }
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add apps/learn/app.yaml
          git commit -m "Update learn image to ${{ github.sha }}"
          git push
